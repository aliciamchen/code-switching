[project]
name = "code-switching-2"
version = "0.1.0"
description = "Signaling social identity in referential communication: preprocessing, analysis, and computational modeling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scipy==1.14.1",
    "matplotlib==3.8.4",
    "seaborn==0.13.2",
    "jax==0.4.35",
    "jaxlib==0.4.35",
    "optax==0.2.3",
    "memo-lang==0.4.1",
    "sentence-transformers>=3.0",
    "manim==0.18.1",
    "manimpango==0.5.0",
    "pycairo==1.26.1",
    "ipykernel==6.29.5",
    "ipython==8.26.0",
    "jupyter>=1.0",
    "tqdm==4.66.5",
]

[dependency-groups]
dev = [
    "ruff>=0.15",
]

[tool.uv]
package = false
